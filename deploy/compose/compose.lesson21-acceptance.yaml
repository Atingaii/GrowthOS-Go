services:
  api:
    image: "${GROWTHOS_LESSON24_ACCEPTANCE_API_IMAGE:?set GROWTHOS_LESSON24_ACCEPTANCE_API_IMAGE}"
    environment:
      # This legacy Lottery/cache acceptance does not attest the Identity
      # browser boundary: its Docker-assigned host port is unknown until Web is
      # created. Lesson 32 browser acceptance must bind and configure one exact
      # origin before it starts the API rather than treating the base 8088
      # development origin as evidence for this random-port overlay.
      # The process default is off and staging/production reject opt-in. Both
      # local Compose files acknowledge this development-only route explicitly.
      GROWTHOS_LOTTERY_EPHEMERAL_SELECTION_ENABLED: "true"
      GROWTHOS_LOTTERY_STRATEGY_CACHE_ENABLED: "${GROWTHOS_LESSON24_ACCEPTANCE_CACHE_ENABLED:-true}"
      GROWTHOS_LOG_LEVEL: debug

  migrate:
    image: "${GROWTHOS_LESSON24_ACCEPTANCE_MIGRATE_IMAGE:?set GROWTHOS_LESSON24_ACCEPTANCE_MIGRATE_IMAGE}"

  redis:
    image: "${GROWTHOS_LESSON24_ACCEPTANCE_REDIS_IMAGE:?set GROWTHOS_LESSON24_ACCEPTANCE_REDIS_IMAGE}"

  web:
    image: "${GROWTHOS_LESSON24_ACCEPTANCE_WEB_IMAGE:?set GROWTHOS_LESSON24_ACCEPTANCE_WEB_IMAGE}"
    # Let Docker allocate one currently free host port atomically. The
    # acceptance script resolves the allocation and verifies the exact
    # loopback-only binding before issuing requests.
    ports: !override
      - "127.0.0.1::8080"

secrets:
  mysql_root_password:
    file: "${GROWTHOS_LESSON24_ACCEPTANCE_SECRET_DIRECTORY:?set GROWTHOS_LESSON24_ACCEPTANCE_SECRET_DIRECTORY}/mysql_root_password"
  mysql_app_password:
    file: "${GROWTHOS_LESSON24_ACCEPTANCE_SECRET_DIRECTORY:?set GROWTHOS_LESSON24_ACCEPTANCE_SECRET_DIRECTORY}/mysql_app_password"
  mysql_migration_password:
    file: "${GROWTHOS_LESSON24_ACCEPTANCE_SECRET_DIRECTORY:?set GROWTHOS_LESSON24_ACCEPTANCE_SECRET_DIRECTORY}/mysql_migration_password"
  mysql_identity_password:
    file: "${GROWTHOS_LESSON24_ACCEPTANCE_SECRET_DIRECTORY:?set GROWTHOS_LESSON24_ACCEPTANCE_SECRET_DIRECTORY}/mysql_identity_password"
  mysql_identity_provisioner_password:
    file: "${GROWTHOS_LESSON24_ACCEPTANCE_SECRET_DIRECTORY:?set GROWTHOS_LESSON24_ACCEPTANCE_SECRET_DIRECTORY}/mysql_identity_provisioner_password"
  identity_throttle_hmac_key:
    file: "${GROWTHOS_LESSON24_ACCEPTANCE_SECRET_DIRECTORY:?set GROWTHOS_LESSON24_ACCEPTANCE_SECRET_DIRECTORY}/identity_throttle_hmac_key"
  identity_csrf_active_key:
    file: "${GROWTHOS_LESSON24_ACCEPTANCE_SECRET_DIRECTORY:?set GROWTHOS_LESSON24_ACCEPTANCE_SECRET_DIRECTORY}/identity_csrf_active_key"
  redis_password:
    file: "${GROWTHOS_LESSON24_ACCEPTANCE_SECRET_DIRECTORY:?set GROWTHOS_LESSON24_ACCEPTANCE_SECRET_DIRECTORY}/redis_password"

volumes:
  mysql_data:
    name: "${GROWTHOS_LESSON24_ACCEPTANCE_PROJECT:?set GROWTHOS_LESSON24_ACCEPTANCE_PROJECT}_mysql_data"
    labels:
      com.growthos.acceptance: lesson-24
      com.growthos.acceptance.project: "${GROWTHOS_LESSON24_ACCEPTANCE_PROJECT:?set GROWTHOS_LESSON24_ACCEPTANCE_PROJECT}"
  mysql_socket:
    name: "${GROWTHOS_LESSON24_ACCEPTANCE_PROJECT:?set GROWTHOS_LESSON24_ACCEPTANCE_PROJECT}_mysql_socket"
    labels:
      com.growthos.acceptance: lesson-24
      com.growthos.acceptance.project: "${GROWTHOS_LESSON24_ACCEPTANCE_PROJECT:?set GROWTHOS_LESSON24_ACCEPTANCE_PROJECT}"
