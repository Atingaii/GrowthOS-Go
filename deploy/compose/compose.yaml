name: growthos

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: growthos
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      TZ: UTC
    secrets:
      - mysql_root_password
      - mysql_app_password
      - mysql_migration_password
      - mysql_identity_password
      - mysql_identity_provisioner_password
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_socket:/var/run/mysqld
      - ./mysql/init/10-create-growthos-users.sh:/docker-entrypoint-initdb.d/10-create-growthos-users.sh:ro
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$(cat /run/secrets/mysql_migration_password)"
          mysql --protocol=tcp --host=127.0.0.1 --user=growthos_migrator
          --database=growthos --silent --skip-column-names
          --execute='SELECT 1' | grep -qx 1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: "no"
    stop_grace_period: 30s
    logging: *json-logging

  migrate:
    image: growthos/migrate:lesson-32
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      target: migrate
      args:
        VERSION: lesson-32
    environment:
      GROWTHOS_ENVIRONMENT: development
      GROWTHOS_LOG_FORMAT: json
      GROWTHOS_MYSQL_ADDRESS: mysql:3306
      GROWTHOS_MYSQL_DATABASE: growthos
      GROWTHOS_MYSQL_TLS_MODE: disabled
      GROWTHOS_MYSQL_MIGRATION_USER: growthos_migrator
      GROWTHOS_MYSQL_MIGRATION_PASSWORD_FILE: /run/secrets/mysql_migration_password
    secrets:
      - mysql_migration_password
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    stop_grace_period: 50s
    logging: *json-logging

  mysql-grants:
    image: mysql:8.4.11
    user: "999:999"
    entrypoint: [/bin/sh, /usr/local/bin/reconcile-growthos-app-grants.sh]
    command: []
    secrets:
      - mysql_root_password
      - mysql_identity_password
      - mysql_identity_provisioner_password
    volumes:
      - ./mysql/grants/empty:/var/lib/mysql:ro
      - mysql_socket:/var/run/mysqld:ro
      - ./mysql/grants/reconcile-growthos-app-grants.sh:/usr/local/bin/reconcile-growthos-app-grants.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    stop_grace_period: 10s
    logging: *json-logging

  identity-provision:
    profiles:
      - operations
    image: growthos/identity-provision:lesson-32
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      target: identity-provision
      args:
        VERSION: lesson-32
    user: "65532:65532"
    environment:
      GROWTHOS_ENVIRONMENT: development
      GROWTHOS_LOG_FORMAT: json
      GROWTHOS_MYSQL_ADDRESS: mysql:3306
      GROWTHOS_MYSQL_DATABASE: growthos
      GROWTHOS_MYSQL_TLS_MODE: disabled
      GROWTHOS_IDENTITY_PROVISIONER_MYSQL_USER: growthos_identity_provisioner
      GROWTHOS_IDENTITY_PROVISIONER_MYSQL_PASSWORD_FILE: /run/secrets/mysql_identity_provisioner_password
    secrets:
      - mysql_identity_provisioner_password
    depends_on:
      mysql-grants:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    stop_grace_period: 10s
    logging: *json-logging

  identity-maintenance:
    profiles:
      - operations
    image: growthos/identity-maintenance:lesson-32
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      target: identity-maintenance
      args:
        VERSION: lesson-32
    user: "65532:65532"
    command: [run]
    environment:
      GROWTHOS_ENVIRONMENT: development
      GROWTHOS_LOG_LEVEL: info
      GROWTHOS_LOG_FORMAT: json
      GROWTHOS_MYSQL_ADDRESS: mysql:3306
      GROWTHOS_MYSQL_DATABASE: growthos
      GROWTHOS_MYSQL_TLS_MODE: disabled
      GROWTHOS_MYSQL_CONNECT_TIMEOUT: 3s
      GROWTHOS_MYSQL_WRITE_TIMEOUT: 5s
      GROWTHOS_IDENTITY_MYSQL_USER: growthos_identity
      GROWTHOS_IDENTITY_MYSQL_PASSWORD_FILE: /run/secrets/mysql_identity_password
      GROWTHOS_IDENTITY_MAINTENANCE_MYSQL_READ_TIMEOUT: 5s
      GROWTHOS_IDENTITY_MAINTENANCE_MYSQL_PING_TIMEOUT: 3s
      GROWTHOS_IDENTITY_MAINTENANCE_OPERATION_TIMEOUT: 3s
    secrets:
      - mysql_identity_password
    depends_on:
      mysql-grants:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    stop_grace_period: 10s
    logging: *json-logging

  api:
    image: growthos/api:lesson-32
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      target: api
      args:
        VERSION: lesson-32
    environment:
      GROWTHOS_ENVIRONMENT: development
      GROWTHOS_HTTP_ADDRESS: 0.0.0.0:8080
      GROWTHOS_HTTP_WRITE_TIMEOUT: 10s
      GROWTHOS_LOTTERY_EPHEMERAL_SELECTION_ENABLED: "true"
      GROWTHOS_LOTTERY_SELECTION_TIMEOUT: 3s
      GROWTHOS_LOTTERY_STRATEGY_CACHE_ENABLED: "true"
      GROWTHOS_LOTTERY_STRATEGY_CACHE_TTL: 5m
      GROWTHOS_LOG_FORMAT: json
      GROWTHOS_MYSQL_ADDRESS: mysql:3306
      GROWTHOS_MYSQL_DATABASE: growthos
      GROWTHOS_MYSQL_TLS_MODE: disabled
      GROWTHOS_MYSQL_USER: growthos_app
      GROWTHOS_MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      GROWTHOS_MYSQL_PING_TIMEOUT: 2s
      GROWTHOS_IDENTITY_MYSQL_USER: growthos_identity
      GROWTHOS_IDENTITY_MYSQL_PASSWORD_FILE: /run/secrets/mysql_identity_password
      GROWTHOS_IDENTITY_MYSQL_PING_TIMEOUT: 2s
      GROWTHOS_IDENTITY_PUBLIC_ORIGIN: "http://127.0.0.1:${GROWTHOS_COMPOSE_WEB_PORT:-8088}"
      GROWTHOS_IDENTITY_THROTTLE_HMAC_KEY_FILE: /run/secrets/identity_throttle_hmac_key
      GROWTHOS_IDENTITY_CSRF_ACTIVE_KEY_ID: "${GROWTHOS_COMPOSE_IDENTITY_CSRF_ACTIVE_KEY_ID:-local-v1}"
      GROWTHOS_IDENTITY_CSRF_ACTIVE_KEY_FILE: /run/secrets/identity_csrf_active_key
      GROWTHOS_IDENTITY_ARGON2_MAX_CONCURRENT: "2"
      GROWTHOS_IDENTITY_ARGON2_ACQUIRE_TIMEOUT: 250ms
      GROWTHOS_IDENTITY_HTTP_HANDLER_TIMEOUT: 3s
      GROWTHOS_REDIS_ADDRESS: redis:6379
      GROWTHOS_REDIS_USERNAME: growthos_api
      GROWTHOS_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      GROWTHOS_REDIS_TLS_MODE: disabled
    secrets:
      - mysql_app_password
      - mysql_identity_password
      - identity_throttle_hmac_key
      - identity_csrf_active_key
      - redis_password
    depends_on:
      mysql-grants:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    networks:
      - edge
      - data
      - cache
    expose:
      - "8080"
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    stop_grace_period: 10s
    logging: *json-logging

  redis:
    image: growthos/redis:7.4.11-lesson-24
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.redis
    secrets:
      - redis_password
    networks:
      - cache
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/redis_password)"
          redis-cli --no-auth-warning --user growthos_api ping | grep -qx PONG
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /data:rw,noexec,nosuid,size=64m,uid=999,gid=999,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    stop_grace_period: 30s
    logging: *json-logging

  web:
    image: growthos/web:lesson-22
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    networks:
      - edge
    ports:
      - "127.0.0.1:${GROWTHOS_COMPOSE_WEB_PORT:-8088}:8080"
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/container-health]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    stop_grace_period: 10s
    logging: *json-logging

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_app_password:
    file: ./secrets/mysql_app_password
  mysql_migration_password:
    file: ./secrets/mysql_migration_password
  mysql_identity_password:
    file: ./secrets/mysql_identity_password
  mysql_identity_provisioner_password:
    file: ./secrets/mysql_identity_provisioner_password
  identity_throttle_hmac_key:
    file: ./secrets/identity_throttle_hmac_key
  identity_csrf_active_key:
    file: ./secrets/identity_csrf_active_key
  redis_password:
    file: ./secrets/redis_password

volumes:
  mysql_data:
  mysql_socket:

networks:
  edge:
  data:
    internal: true
  cache:
    internal: true
