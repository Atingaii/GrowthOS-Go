worker_processes auto;
pid /tmp/nginx.pid;

# Stock nginx error lines can append the raw request target and Referer, and
# their format is not customizable. Keep request-level upstream diagnostics in
# the sanitized access log; stderr remains available for critical startup and
# runtime failures.
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Preserve exactly one syntactically safe client correlation ID. Invalid,
    # duplicated, or missing values are replaced at the edge before proxying so
    # nginx gateway errors and Go logs share one identifier.
    map $http_x_request_id $growthos_upstream_request_id {
        default                         $request_id;
        "~^[A-Za-z0-9_.:-]{1,64}$"     $http_x_request_id;
    }

    map $upstream_http_x_request_id $growthos_log_request_id {
        default $upstream_http_x_request_id;
        ""      $growthos_upstream_request_id;
    }

    # This image is the loopback-only Compose edge. Reject arbitrary Host
    # values instead of accepting DNS-rebinding names through `server_name _`.
    map $http_host $growthos_allowed_host {
        default                              0;
        "~*^localhost(?::[0-9]{1,5})?$"        1;
        "~^127[.]0[.]0[.]1(?::[0-9]{1,5})?$"  1;
        "~^\[::1\](?::[0-9]{1,5})?$"          1;
    }

    # nginx decodes chunked request bodies before proxying, so an empty
    # chunked body can otherwise become indistinguishable from no body at the
    # Go adapter. Preserve the public no-body contract at the first component
    # that can still observe the client's transfer framing.
    map $http_transfer_encoding $growthos_has_transfer_encoding {
        ""      0;
        default 1;
    }

    # Query strings and Referer values may contain tokens, authorization codes,
    # filters, or PII. Log the normalized path only. For proxied responses use
    # the API's final request ID; static/gateway responses fall back to nginx's.
    log_format growthos '$remote_addr request_id=$growthos_log_request_id '
                        '[$time_local] "$request_method $uri $server_protocol" '
                        'status=$status upstream_status=$upstream_status bytes=$body_bytes_sent '
                        'request_time=$request_time upstream_time=$upstream_response_time';
    access_log /dev/stdout growthos;

    sendfile on;
    keepalive_timeout 30s;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        listen [::]:8080;
        server_name localhost 127.0.0.1;

        if ($growthos_allowed_host = 0) {
            return 421;
        }

        root /usr/share/nginx/html;
        index index.html;

        # Docker service IPs may change when a container is recreated. Keeping
        # the upstream in a variable lets nginx re-resolve the stable service
        # name through Docker's embedded DNS instead of pinning the startup IP.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $growthos_api_origin http://api:8080;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-store" always;
        add_header X-Request-ID $growthos_log_request_id always;

        location = /container-health {
            access_log off;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Request-ID $growthos_log_request_id always;
            return 204;
        }

        location ~ ^/(health|ready)$ {
            proxy_pass $growthos_api_origin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $growthos_upstream_request_id;
            proxy_hide_header X-Request-ID;
            proxy_hide_header Cache-Control;
            proxy_connect_timeout 2s;
            proxy_send_timeout 4s;
            proxy_read_timeout 4s;
        }

        location ~ ^/api(?:/|$) {
            # Current business API requests are tiny. A declared oversized body
            # is rejected at the edge; other body framing is streamed so the Go
            # adapter can fail closed without waiting for a full upload.
            client_max_body_size 16k;
            client_body_timeout 3s;
            proxy_request_buffering off;
            if ($growthos_has_transfer_encoding = 1) {
                return 460;
            }
            proxy_pass $growthos_api_origin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $growthos_upstream_request_id;
            proxy_hide_header X-Request-ID;
            proxy_hide_header Cache-Control;
            proxy_connect_timeout 2s;
            proxy_send_timeout 4s;
            # The API process has a 10-second write deadline while the current
            # selection use case has a 3-second cooperative deadline. Keep the
            # gateway inactivity budget outside both so Go normally owns the
            # application error response.
            proxy_read_timeout 11s;

            error_page 413 = @api_request_too_large;
            error_page 460 =400 @api_request_body_not_allowed;
            error_page 502 = @api_bad_gateway;
            error_page 504 = @api_gateway_timeout;

            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Cache-Control "no-store" always;
            add_header X-Request-ID $growthos_log_request_id always;
        }

        location @api_request_body_not_allowed {
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Cache-Control "no-store" always;
            add_header X-Request-ID $growthos_upstream_request_id always;
            return 400 '{"error":{"code":"request_body_not_allowed","message":"request body is not allowed","request_id":"$growthos_upstream_request_id"}}';
        }

        location @api_request_too_large {
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Cache-Control "no-store" always;
            add_header X-Request-ID $growthos_upstream_request_id always;
            return 413 '{"error":{"code":"request_too_large","message":"request body exceeds the gateway limit","request_id":"$growthos_upstream_request_id"}}';
        }

        location @api_bad_gateway {
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Cache-Control "no-store" always;
            add_header X-Request-ID $growthos_upstream_request_id always;
            return 502 '{"error":{"code":"bad_gateway","message":"upstream service is unavailable","request_id":"$growthos_upstream_request_id"}}';
        }

        location @api_gateway_timeout {
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Cache-Control "no-store" always;
            add_header X-Request-ID $growthos_upstream_request_id always;
            return 504 '{"error":{"code":"gateway_timeout","message":"upstream service timed out","request_id":"$growthos_upstream_request_id"}}';
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Request-ID $growthos_log_request_id always;
        }

        location = /index.html {
            add_header Cache-Control "no-store";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Request-ID $growthos_log_request_id always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
