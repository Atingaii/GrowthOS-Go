<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" fill="none" role="img" aria-labelledby="title description">
  <title id="title">GrowthOS 增长闭环品牌视觉</title>
  <description id="description">活动、触达、行为、数据与 AI 工具围绕增长核心形成持续反馈闭环。</description>
  <defs>
    <linearGradient id="background" x1="120" y1="30" x2="1450" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B12"/>
      <stop offset="0.5" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="blue" x1="480" y1="120" x2="1110" y2="570" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="multi" x1="500" y1="120" x2="1090" y2="570" gradientUnits="userSpaceOnUse">
